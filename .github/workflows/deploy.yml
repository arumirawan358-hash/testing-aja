name: Deploy KuisKita to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      # Temporary, anonymous probe to verify whether the real Groq endpoint allows browser access.
      - name: Probe Groq browser CORS (no valid key)
        run: |
          set -eu
          url='https://api.groq.com/openai/v1/chat/completions'
          origin='https://arumirawan358-hash.github.io'
          status=$(curl --max-time 30 -sS -o /dev/null -D /tmp/groq-preflight -w '%{http_code}' -X OPTIONS "$url" -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type')
          echo "Preflight HTTP $status"
          test "$status" = 204
          tr -d '\r' < /tmp/groq-preflight | grep -qi '^access-control-allow-origin: \*'
          tr -d '\r' < /tmp/groq-preflight | grep -qi '^access-control-allow-headers:.*authorization'
          status=$(curl --max-time 30 -sS -o /dev/null -D /tmp/groq-post -w '%{http_code}' -X POST "$url" -H "Origin: $origin" -H 'Authorization: Bearer invalid-test-token' -H 'Content-Type: application/json' -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"test"}]}')
          echo "Fake-key request HTTP $status (401 expected)"
          test "$status" = 401
          tr -d '\r' < /tmp/groq-post | grep -qi '^access-control-allow-origin: \*'
          echo 'Groq browser CORS checks passed; no model completion was requested with a valid key.'
      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SIGNALING_MODE: cloud
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
