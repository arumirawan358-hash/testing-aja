name: Temporary PeerJS Cloud probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: google-chrome --version
      - run: npm run build
        env:
          VITE_BASE_PATH: /testing-aja/
          VITE_SIGNALING_MODE: cloud
      - run: node .github/probes/cloud-peer.mjs
